name: CI/CD - Dashboard App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

# Dois pushes seguidos: o deploy mais antigo é cancelado em vez de brigar com o novo
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/dashboard-app

jobs:
  test:
    name: Testes e lint
    runs-on: ubuntu-latest
    # Postgres descartável só pros testes, no lugar da Aiven
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (flake8)
        run: flake8 . --max-line-length=100 --extend-ignore=E501,W503

      - name: Testes (unittest + Postgres do CI)
        env:
          AIVEN_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
          DB_SSLMODE: disable
        run: python -m unittest -v test_app

  build-and-push:
    name: Build + push da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # cache de camadas entre execuções: só reinstala as libs se o requirements mudar
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy (Render)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
    steps:
      - name: Disparar deploy hook do Render
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL não configurado, deploy pulado"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null

      # Espera o /healthz responder com o commit deste push. Um "ok" simples
      # passaria com a versão antiga ainda no ar. Free tier do Render demora:
      # build + cold start pode passar de 5 min, então tenta por até 10.
      - name: Health check pós-deploy
        run: |
          if [ -z "$HOOK" ] || [ -z "$APP_URL" ]; then
            echo "::warning::APP_HEALTHCHECK_URL não configurado, health check pulado"
            exit 0
          fi
          for i in $(seq 1 40); do
            body=$(curl -fsS --max-time 20 "$APP_URL/healthz" || true)
            status=$(echo "$body" | jq -r '.status // empty' 2>/dev/null || true)
            commit=$(echo "$body" | jq -r '.commit // empty' 2>/dev/null || true)
            echo "tentativa $i: ${body:-sem resposta}"
            if [ "$status" = "ok" ] && [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Versão $GITHUB_SHA no ar."
              exit 0
            fi
            # Sem RENDER_GIT_COMMIT (ex.: rodando fora do Render) não dá pra
            # comparar versão; depois de ~3 min aceita só o status.
            if [ "$status" = "ok" ] && [ -z "$commit" ] && [ "$i" -ge 12 ]; then
              echo "::warning::/healthz sem commit, conferindo só o status"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$APP_URL/healthz não respondeu com o commit $GITHUB_SHA em 10 min"
          exit 1
