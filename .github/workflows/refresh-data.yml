name: Dados - Refresh agendado (BCB)

# Chama /api/refresh a cada 6h, mesmo sem visitas. Serve pra duas coisas:
# a primeira visita do dia já pega dado novo, e o Postgres free da Aiven
# não fica "parado" (a Aiven pode desligar serviço free sem atividade).
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ secrets.APP_HEALTHCHECK_URL }}
    steps:
      - name: Disparar /api/refresh
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::APP_HEALTHCHECK_URL não configurado, nada a fazer"
            exit 0
          fi
          # --retry cobre o cold start do Render free (app dormindo)
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 60 \
            -X POST "$APP_URL/api/refresh"
